name: Import V1 Director PDM Flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-v1-director-pdm.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest V1 project flow build
        run: |
          curl -L --fail --retry 3 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-89b4-81f6-83e0-a9dad2567a01/raw?se=2026-09-30T19%3A08%3A12Z&sp=r&sv=2026-02-06&sr=b&scid=595a2c92-351b-5a52-aed7-5a94dc02386e&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T17%3A10%3A55Z&ske=2026-10-01T17%3A10%3A55Z&sks=b&skv=2026-02-06&sig=Cp/90qlHvYWSwBP8sTfhRcAkz1hdMFqwYF85cwqtUsk%3D' -o /tmp/thinktank-v1.zip
          rm -rf v1
          mkdir -p v1
          unzip -q /tmp/thinktank-v1.zip -d v1
      - name: Publish project flow mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1
          git commit -m "Publish Think Tank V1 director PDM project flow"
          git push
