name: Import V1 Foundation Mirror

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-v1-foundation.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest V1 foundation build
        run: |
          curl -L --fail --retry 3 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-7610-81f6-9239-8d06520617bb/raw?se=2026-09-30T14%3A54%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=e719dbe8-9ccf-5a8f-88da-e80eb5a34331&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T11%3A26%3A07Z&ske=2026-10-01T11%3A26%3A07Z&sks=b&skv=2026-02-06&sig=0o7nHSu6r0xZXBFsHMIMonAtJczBW5awQgb80Rdo1Gs%3D' -o /tmp/thinktank-v1.zip
          rm -rf v1
          mkdir -p v1
          unzip -q /tmp/thinktank-v1.zip -d v1
      - name: Publish V1 foundation mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1
          git commit -m "Publish Think Tank V1 Knowledge Foundation"
          git push
