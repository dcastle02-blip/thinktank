name: Import V1 Role Hierarchy Mirror

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-v1-role-hierarchy.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest V1 role hierarchy build
        run: |
          curl -L --fail --retry 3 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-79b8-81f6-a111-7f79b553fa82/raw?se=2026-09-30T18%3A55%3A33Z&sp=r&sv=2026-02-06&sr=b&scid=3bf3e10d-625a-53f2-ad52-cc10228bbaad&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T12%3A08%3A47Z&ske=2026-10-01T12%3A08%3A47Z&sks=b&skv=2026-02-06&sig=%2Bigo/aL7KCbEX9zYPluh0p52bagsD31ncQAt1i2Gf/Q%3D' -o /tmp/thinktank-v1.zip
          rm -rf v1
          mkdir -p v1
          unzip -q /tmp/thinktank-v1.zip -d v1
      - name: Publish role hierarchy mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1
          git commit -m "Publish Think Tank V1 role hierarchy"
          git push
