name: Import V1 PDM Dashboard
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-v1-pdm-dashboard.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified PDM dashboard build
        run: |
          curl -L --fail --retry 3 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-8704-822f-b550-f4e230b416d4/raw?se=2026-10-01T17%3A41%3A12Z&sp=r&sv=2026-02-06&sr=b&scid=301e1e54-c58c-5f6c-96ed-def4abfd7078&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T15%3A04%3A58Z&ske=2026-10-02T15%3A04%3A58Z&sks=b&skv=2026-02-06&sig=ERbpFX19lcrrZgZp858MDKFm1jrTKWK81oefJExIbc8%3D' -o /tmp/thinktank-v1.zip
          rm -rf v1
          mkdir -p v1
          unzip -q /tmp/thinktank-v1.zip -d v1
      - name: Publish Think Tank V1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1
          git commit -m "Publish Think Tank PDM dashboard"
          git push
