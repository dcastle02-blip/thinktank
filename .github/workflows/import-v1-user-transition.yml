name: Import V1 User Transition

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-v1-user-transition.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest V1 transition build
        run: |
          curl -L --fail --retry 3 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-b8d4-81f6-b3c3-137f3a1ebb38/raw?se=2026-10-01T01%3A30%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=99b93ef4-204b-5c1e-98c4-e7d9cac2dda7&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T17%3A19%3A47Z&ske=2026-10-01T17%3A19%3A47Z&sks=b&skv=2026-02-06&sig=cPPFm5FKn/ku/T3NOBE6ssK7iaEh2VPqyOE6Qqjg5RQ%3D' -o /tmp/thinktank-v1.zip
          rm -rf v1
          mkdir -p v1
          unzip -q /tmp/thinktank-v1.zip -d v1
      - name: Publish user transition mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1
          git commit -m "Publish Think Tank V1 user transition workflow"
          git push
