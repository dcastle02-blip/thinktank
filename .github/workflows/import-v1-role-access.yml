name: Import V1 Role Access Mirror

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-v1-role-access.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest V1 role access build
        run: |
          curl -L --fail --retry 3 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-a690-822f-8fe3-c8a5fe80726e/raw?se=2026-09-30T18%3A40%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=3a65ac5f-5f7b-52d3-8aec-be4f53cf8ad9&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T18%3A15%3A50Z&ske=2026-10-01T18%3A15%3A50Z&sks=b&skv=2026-02-06&sig=FAHnMmxDoXcMpCe3m7//6ptpQwj55eIXf87pE3H1BOc%3D' -o /tmp/thinktank-v1.zip
          rm -rf v1
          mkdir -p v1
          unzip -q /tmp/thinktank-v1.zip -d v1
      - name: Publish role access mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1
          git commit -m "Publish Think Tank V1 role access and invite links"
          git push
