name: Import V1 Idea Impact Mirror

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-v1-idea-impact.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest V1 idea impact build
        run: |
          curl -L --fail --retry 3 'https://sdmntprsoutheastus3.oaiusercontent.com/files/00000000-f620-820c-8f8c-f8016df7fb88/raw?se=2026-09-30T16%3A20%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=671df992-147b-5899-a3ca-ae6325a4f425&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T15%3A54%3A51Z&ske=2026-10-01T15%3A54%3A51Z&sks=b&skv=2026-02-06&sig=WLhDoib2U3ezJV9rAUOdKpcfuWs95F4fAGQl51Cir60%3D' -o /tmp/thinktank-v1.zip
          rm -rf v1
          mkdir -p v1
          unzip -q /tmp/thinktank-v1.zip -d v1
      - name: Publish idea impact mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1
          git commit -m "Publish Think Tank V1 guided idea impact"
          git push
