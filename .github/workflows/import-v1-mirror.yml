name: Import V1 Static Mirror

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-v1-mirror.yml'

permissions:
  contents: write

jobs:
  import:
    if: github.event.head_commit.message != 'Publish Think Tank V1 static mirror'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download built V1 artifact
        run: |
          curl -L --fail --retry 3 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-db9c-81f6-bcba-a6a84c34c634/raw?se=2026-09-30T13%3A10%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=b8953584-d527-5e00-9007-de3a4818bc43&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T09%3A28%3A37Z&ske=2026-10-01T09%3A28%3A37Z&sks=b&skv=2026-02-06&sig=yWoEzcTDGkZEzcdtX8pOTSsspiRLE5/fsdMHwBZ%2B0d8%3D' -o /tmp/thinktank-v1.zip
          rm -rf v1
          mkdir -p v1
          unzip -q /tmp/thinktank-v1.zip -d v1
      - name: Publish mirror files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1
          git commit -m "Publish Think Tank V1 static mirror"
          git push
