name: Import V1 Roles Mirror

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-v1-roles.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download built V1 artifact
        run: |
          curl -L --fail --retry 3 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-7a1c-81f6-9895-b802d282ef06/raw?se=2026-09-30T13%3A57%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=d3f9f4bd-ec2d-50ed-b91c-4e8003bcd488&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T12%3A51%3A29Z&ske=2026-10-01T12%3A51%3A29Z&sks=b&skv=2026-02-06&sig=bSdRS3Ai/vNc5QhcRBYvG3lB5TwXjGT5sXkJzYd2cZY%3D' -o /tmp/thinktank-v1.zip
          rm -rf v1
          mkdir -p v1
          unzip -q /tmp/thinktank-v1.zip -d v1
      - name: Publish mirror files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1
          git commit -m "Publish Think Tank V1 roles and governance"
          git push
