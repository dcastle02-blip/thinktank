name: Import V1 Roles Mirror

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-v1-roles.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest built V1 artifact
        run: |
          curl -L --fail --retry 3 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-e430-81f6-8233-cc9b0703f688/raw?se=2026-09-30T13%3A59%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=980785eb-22e1-5b35-833f-81dca0699f62&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T07%3A56%3A38Z&ske=2026-10-01T07%3A56%3A38Z&sks=b&skv=2026-02-06&sig=WnTVEXqYt91k/XkRbX40or2kXzdmkpYN0gjPo/IHiGQ%3D' -o /tmp/thinktank-v1.zip
          rm -rf v1
          mkdir -p v1
          unzip -q /tmp/thinktank-v1.zip -d v1
      - name: Publish latest mirror files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1
          git commit -m "Publish latest Think Tank V1 governance build"
          git push
