name: Import V1 Project Workspace

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-v1-project-workspace.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest V1 project workspace build
        run: |
          curl -L --fail --retry 3 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-a6a0-81f6-9625-49f748b07642/raw?se=2026-10-01T16%3A49%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=139419f5-d06f-5bda-b061-0e8bc3233897&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T13%3A41%3A59Z&ske=2026-10-02T13%3A41%3A59Z&sks=b&skv=2026-02-06&sig=Ab6fl2RmAOt/o3jngnjIXPlsGfWrp/pMGNLDOVs8LaE%3D' -o /tmp/thinktank-v1.zip
          rm -rf v1
          mkdir -p v1
          unzip -q /tmp/thinktank-v1.zip -d v1
      - name: Publish project-centric V1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1
          git commit -m "Publish Think Tank V1 project workspace"
          git push
