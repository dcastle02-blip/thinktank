name: Import V1 AI Handoff Mirror

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-v1-ai-handoff.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest V1 build
        run: |
          curl -L --fail --retry 3 'https://sdmntprsoutheastus3.oaiusercontent.com/files/00000000-cd88-820c-b3b8-fba58b50de57/raw?se=2026-09-30T15%3A44%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=5e0ec10a-480d-5975-97c8-64d0d108343d&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T13%3A08%3A02Z&ske=2026-10-01T13%3A08%3A02Z&sks=b&skv=2026-02-06&sig=aso77EadQTXcCxGCfjHtcM%2BP7M%2BjGw8mkKHVkXHWF6U%3D' -o /tmp/thinktank-v1.zip
          rm -rf v1
          mkdir -p v1
          unzip -q /tmp/thinktank-v1.zip -d v1
      - name: Publish mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1
          git commit -m "Publish Think Tank V1 AI extraction and handoff"
          git push
