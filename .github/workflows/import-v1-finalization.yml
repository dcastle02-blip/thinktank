name: Import V1 Finalization Mirror

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-v1-finalization.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest built V1 artifact
        run: |
          curl -L --fail --retry 3 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-6a38-81f6-b320-932f9f6ab32b/raw?se=2026-09-30T14%3A28%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=b089587f-5a8a-5dd1-b7cf-87f6956674d7&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T12%3A30%3A12Z&ske=2026-10-01T12%3A30%3A12Z&sks=b&skv=2026-02-06&sig=MJi64omJW3AML52Kc2OBxsNBxChwfwmIFWHjuJ3mDlc%3D' -o /tmp/thinktank-v1.zip
          rm -rf v1
          mkdir -p v1
          unzip -q /tmp/thinktank-v1.zip -d v1
      - name: Publish latest mirror files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1
          git commit -m "Publish Think Tank V1 finalization workflow"
          git push
