<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0d10" />
  <title>Think Tank V1</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#090b0e;color:#eef1f4;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}
    .card{width:min(520px,100%);background:#101419;border:1px solid #252c33;border-radius:22px;padding:30px}
    .mark{width:48px;height:48px;border-radius:14px;background:#171c22;border:1px solid #2a3139;display:grid;place-items:center;font-size:22px;margin-bottom:18px}
    .eyebrow{color:#7f8994;text-transform:uppercase;letter-spacing:.11em;font-size:10px;font-weight:700}
    h1{font-size:38px;line-height:1.05;margin:12px 0}
    p{color:#939ba5;line-height:1.55}
    .ok{margin-top:24px;padding:14px;border:1px solid #2d493b;background:#101a15;border-radius:12px}
    code{color:#dfe5eb}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">✦</div>
    <div class="eyebrow">Think Tank V1</div>
    <h1>GitHub host test passed.</h1>
    <p>This page is being served from the existing public Think Tank GitHub Pages site. It is only a connectivity test while the full V1 app remains in the private repository.</p>
    <div class="ok"><strong>Host:</strong> <code>github.io</code><br><strong>Status:</strong> reachable</div>
  </main>
</body>
</html>
