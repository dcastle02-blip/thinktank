<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10141c"><title>Think Tank · Demo</title>
<style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#edf2f7;background:#10141c}*{box-sizing:border-box}body{margin:0}header{padding:22px max(20px,calc((100vw - 760px)/2));border-bottom:1px solid #344052;background:#161e29}h1{font-size:24px;margin:0 0 3px}.sub{color:#aab9cc;font-size:13px}.wrap{max-width:760px;margin:auto;padding:20px 18px 210px}.empty{color:#aab9cc;padding:50px 14px;text-align:center}.turn{background:#1c2633;border:1px solid #364558;border-radius:16px;margin:15px 0;padding:15px 18px;white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere}.turn b{display:block;margin-bottom:7px;color:#aacefa}.turn.Dylan b{color:#e9c99e}.turn.Claude b{color:#d9b8ff}.composer{position:fixed;bottom:0;left:0;right:0;background:#161e29;border-top:1px solid #344052;padding:14px max(18px,calc((100vw - 760px)/2)) max(16px,env(safe-area-inset-bottom))}textarea{width:100%;min-height:70px;max-height:180px;resize:vertical;border:1px solid #506176;border-radius:12px;background:#101823;color:white;padding:13px;font:inherit}.buttons{display:flex;gap:9px;margin-top:8px}button{cursor:pointer;background:#2a394d;color:white;border:1px solid #52637a;border-radius:10px;padding:10px 14px;font-weight:650}button.primary{background:#8cbafa;color:#10141c;border-color:#8cbafa}button:disabled{opacity:.55;cursor:wait}.status{font-size:12px;color:#b6c3d4;min-height:17px;margin-top:8px}</style></head><body>
<header><h1>Think Tank</h1><div class="sub">A conversation with GPT and Claude</div></header><main class="wrap" id="messages"></main>
<div class="composer"><textarea id="prompt" placeholder="Ask GPT and Claude anything…"></textarea><div class="buttons"><button id="next">Next response</button><button class="primary" id="send">Send to both</button><button id="new">New chat</button></div><div class="status" id="status"></div></div>
<script>
const URL='https://ddxhpsgwxqoejghmsatg.supabase.co/functions/v1/relay';
let transcript=[],nextSpeaker='GPT',busy=false;
const el=id=>document.getElementById(id);
const secret=()=>localStorage.getItem('thinktank_relay_secret')||'';
function render(){el('messages').replaceChildren();if(!transcript.length){const p=document.createElement('div');p.className='empty';p.textContent='Ask a question. GPT responds first, then Claude responds with GPT’s answer in context.';el('messages').append(p)}for(const turn of transcript){const box=document.createElement('article');box.className='turn '+turn.speaker;const label=document.createElement('b');label.textContent=turn.speaker;const body=document.createElement('div');body.textContent=turn.text;box.append(label,body);el('messages').append(box)}el('next').disabled=!transcript.length||busy;el('send').disabled=busy}
async function request(action){if(busy)return;const message=el('prompt').value.trim();if(action==='message'&&!message)return;let key=secret();if(!key){key=prompt('Enter your Think Tank relay secret. It stays in this browser.');if(!key)return;localStorage.setItem('thinktank_relay_secret',key.trim())}busy=true;render();el('status').textContent=action==='message'?'GPT and Claude are responding…':`${nextSpeaker} is responding…`;try{const response=await fetch(URL,{method:'POST',headers:{'Content-Type':'application/json','x-relay-secret':key},body:JSON.stringify({mode:'demo',action,message,transcript,nextSpeaker})});const data=await response.json();if(!response.ok)throw Error(data.error||`HTTP ${response.status}`);transcript=data.transcript;nextSpeaker=data.nextSpeaker;if(action==='message')el('prompt').value='';el('status').textContent='';requestAnimationFrame(()=>window.scrollTo(0,document.body.scrollHeight))}catch(error){el('status').textContent=`Error: ${error.message}`}finally{busy=false;render()}}
el('send').onclick=()=>request('message');el('next').onclick=()=>request('next');el('new').onclick=()=>{if(transcript.length&&!confirm('Start a new demo chat?'))return;transcript=[];nextSpeaker='GPT';el('prompt').value='';el('status').textContent='';render()};el('prompt').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')request('message')});render();
</script></body></html>
