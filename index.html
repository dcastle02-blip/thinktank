<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Think Tank" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>Think Tank</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#0b0f14;--panel:#111821;--panel2:#151e29;--border:#263241;
      --text:#edf3f8;--muted:#91a0af;--accent:#dbeafe;--accentText:#08111d;
      --dylan:#253448;--gpt:#123c34;--claude:#46301f;--danger:#582929;
      --shadow:0 10px 30px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,textarea,input{font:inherit}
    button{cursor:pointer}
    .app{max-width:820px;margin:0 auto;min-height:100dvh}
    header{position:sticky;top:0;z-index:20;padding:max(14px,env(safe-area-inset-top)) 16px 12px;background:rgba(11,15,20,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
    h1{font-size:20px;line-height:1.1;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:5px}
    .header-actions{display:flex;gap:8px}.btn{border:1px solid var(--border);border-radius:12px;padding:10px 13px;background:var(--panel2);color:var(--text);font-weight:650}.btn.primary{background:var(--accent);color:var(--accentText);border-color:transparent}.btn.danger{background:var(--danger)}
    #messages{padding:16px 14px 250px}.empty{padding:72px 24px;text-align:center;color:var(--muted);line-height:1.6}.empty strong{color:var(--text)}
    .card{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow);margin-bottom:16px}.card-head{padding:9px 13px;font-size:12px;font-weight:800;letter-spacing:.08em}.card-body{padding:14px 15px 16px;font-size:16px;line-height:1.58;white-space:pre-wrap;word-wrap:break-word}.speaker-Dylan .card-head{background:var(--dylan)}.speaker-GPT .card-head{background:var(--gpt)}.speaker-Claude .card-head{background:var(--claude)}
    .composer{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(11,15,20,.97);backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:12px max(14px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}.composer-inner{max-width:820px;margin:0 auto}textarea{width:100%;min-height:84px;max-height:190px;resize:vertical;border:1px solid var(--border);border-radius:14px;background:var(--panel);color:var(--text);padding:13px 14px;outline:none}textarea:focus,input:focus{border-color:#4d6783}.actions{display:flex;gap:8px;margin-top:9px}.actions .btn{flex:1}.status{font-size:12px;color:var(--muted);min-height:17px;margin-top:8px}.usage{font-size:12px;color:var(--muted);margin-top:4px}
    .overlay{position:fixed;inset:0;z-index:100;background:rgba(7,10,14,.98);display:flex;align-items:center;justify-content:center;padding:22px}.overlay.hidden{display:none}.setup{width:100%;max-width:460px;border:1px solid var(--border);background:var(--panel);border-radius:20px;padding:22px;box-shadow:var(--shadow)}.setup h2{margin:0 0 8px}.setup p{color:var(--muted);line-height:1.5}.setup input{width:100%;padding:13px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);margin:8px 0 10px}.setup .btn{width:100%}.small{font-size:12px;color:var(--muted);margin-top:10px}.loading .btn,.loading textarea{opacity:.55;pointer-events:none}
    @media (min-width:700px){#messages{padding-left:24px;padding-right:24px}.composer{padding-left:24px;padding-right:24px}}
  </style>
</head>
<body>
<div id="setupOverlay" class="overlay hidden">
  <div class="setup">
    <h2>Connect Think Tank</h2>
    <p>Enter your relay secret. It is stored only in this browser on this device. Your OpenAI and Anthropic API keys stay in Supabase.</p>
    <input id="secretInput" type="password" placeholder="Relay secret" autocomplete="off" />
    <button class="btn primary" id="saveSecretBtn">Save & Open</button>
    <div class="small">You can change or clear this later from Settings.</div>
  </div>
</div>

<div class="app" id="app">
  <header>
    <div class="top">
      <div><h1>Think Tank</h1><div class="sub">Dylan + GPT + Claude · 4-turn debate</div></div>
      <div class="header-actions"><button class="btn" id="settingsBtn">Settings</button><button class="btn" id="newBtn">New</button></div>
    </div>
  </header>

  <main id="messages"></main>

  <div class="composer">
    <div class="composer-inner">
      <textarea id="question" placeholder="Ask the think tank..."></textarea>
      <div class="actions">
        <button class="btn" id="continueBtn">Continue Debate</button>
        <button class="btn primary" id="sendBtn">Send</button>
      </div>
      <div class="status" id="status"></div>
      <div class="usage" id="usage"></div>
    </div>
  </div>
</div>

<script>
  const RELAY_URL = "https://ddxhpsgwxqoejghmsatg.supabase.co/functions/v1/relay";
  const STORAGE = {
    secret: "thinktank_relay_secret",
    transcript: "thinktank_transcript_v1",
    firstSpeaker: "thinktank_first_speaker_v1",
    tokens: "thinktank_tokens_v1"
  };

  let transcript = safeParse(localStorage.getItem(STORAGE.transcript), []);
  let firstSpeaker = localStorage.getItem(STORAGE.firstSpeaker) || "GPT";
  let totalTokens = Number(localStorage.getItem(STORAGE.tokens) || "0");
  let busy = false;

  const $ = (id) => document.getElementById(id);
  function safeParse(value, fallback){ try { return value ? JSON.parse(value) : fallback; } catch { return fallback; } }
  function getSecret(){ return localStorage.getItem(STORAGE.secret) || ""; }
  function saveState(){
    localStorage.setItem(STORAGE.transcript, JSON.stringify(transcript));
    localStorage.setItem(STORAGE.firstSpeaker, firstSpeaker);
    localStorage.setItem(STORAGE.tokens, String(totalTokens));
  }
  function escapeHtml(value){ return String(value ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;"); }
  function speakerClass(name){ return ["Dylan","GPT","Claude"].includes(name) ? name : "Dylan"; }

  function render(){
    if (!transcript.length) {
      $("messages").innerHTML = `<div class="empty"><strong>Start a discussion.</strong><br>One question runs four AI turns: GPT ↔ Claude ↔ GPT ↔ Claude. You get the floor back after each round.</div>`;
    } else {
      $("messages").innerHTML = transcript.map(turn => `
        <section class="card speaker-${speakerClass(turn.speaker)}">
          <div class="card-head">${escapeHtml(turn.speaker).toUpperCase()}</div>
          <div class="card-body">${escapeHtml(turn.text)}</div>
        </section>`).join("");
    }
    $("usage").textContent = `${totalTokens ? `Session tokens: ${totalTokens.toLocaleString()} · ` : ""}Next round starts: ${firstSpeaker}`;
  }

  function setBusy(value, message=""){
    busy = value;
    document.body.classList.toggle("loading", value);
    $("status").textContent = message;
  }

  async function runRound(message){
    if (busy) return;
    const secret = getSecret();
    if (!secret) { $("setupOverlay").classList.remove("hidden"); return; }
    setBusy(true, `${firstSpeaker} is starting. GPT and Claude are debating...`);
    try {
      const response = await fetch(RELAY_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-relay-secret": secret },
        body: JSON.stringify({ message, transcript, firstSpeaker, turns: 4 })
      });
      let data;
      try { data = await response.json(); } catch { throw new Error(`Relay returned HTTP ${response.status} with a non-JSON response.`); }
      if (!response.ok) throw new Error(data?.error || `Relay returned HTTP ${response.status}`);
      transcript = Array.isArray(data.transcript) ? data.transcript : transcript;
      totalTokens += Number(data?.usage?.roundTokens || 0);
      firstSpeaker = firstSpeaker === "GPT" ? "Claude" : "GPT";
      saveState();
      render();
      $("status").textContent = "Round complete.";
      setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }), 40);
    } catch (err) {
      const msg = String(err?.message || err);
      $("status").textContent = msg.includes("Failed to fetch")
        ? "Could not reach the relay. If PowerShell works but this page does not, the relay needs browser CORS enabled."
        : `Error: ${msg}`;
    } finally {
      busy = false;
      document.body.classList.remove("loading");
    }
  }

  $("sendBtn").addEventListener("click", async () => {
    const text = $("question").value.trim();
    if (!text) return;
    $("question").value = "";
    await runRound(text);
  });

  $("continueBtn").addEventListener("click", async () => {
    if (!transcript.length) { $("status").textContent = "Start a conversation first."; return; }
    await runRound("Continue the discussion from where you left off. Address the strongest unresolved points, revise any position that should change, and advance the discussion rather than repeating earlier arguments.");
  });

  $("newBtn").addEventListener("click", () => {
    if (transcript.length && !confirm("Start a new Think Tank conversation?")) return;
    transcript = []; firstSpeaker = "GPT"; totalTokens = 0; saveState(); render(); $("status").textContent = ""; $("question").value = "";
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  $("settingsBtn").addEventListener("click", () => {
    const action = confirm("Press OK to replace the relay secret. Press Cancel to keep the current one.");
    if (action) { $("secretInput").value = ""; $("setupOverlay").classList.remove("hidden"); }
  });

  $("saveSecretBtn").addEventListener("click", () => {
    const value = $("secretInput").value.trim();
    if (!value) return;
    localStorage.setItem(STORAGE.secret, value);
    $("secretInput").value = "";
    $("setupOverlay").classList.add("hidden");
    $("status").textContent = "Relay secret saved on this device.";
  });

  $("question").addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") $("sendBtn").click();
  });

  if (!getSecret()) $("setupOverlay").classList.remove("hidden");
  render();
</script>
</body>
</html>
