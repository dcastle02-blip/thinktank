<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Think Tank" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>Think Tank</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#0b0f14;--panel:#111821;--panel2:#151e29;--border:#263241;
      --text:#edf3f8;--muted:#91a0af;--accent:#dbeafe;--accentText:#08111d;
      --dylan:#253448;--gpt:#123c34;--claude:#46301f;--consensus:#3c2f62;--danger:#582929;
      --shadow:0 10px 30px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,textarea,input{font:inherit}button{cursor:pointer}
    .app{max-width:820px;margin:0 auto;min-height:100dvh}
    header{position:sticky;top:0;z-index:20;padding:max(14px,env(safe-area-inset-top)) 16px 12px;background:rgba(11,15,20,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
    h1{font-size:20px;line-height:1.1;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:5px}.header-actions{display:flex;gap:8px}
    .btn{border:1px solid var(--border);border-radius:12px;padding:10px 13px;background:var(--panel2);color:var(--text);font-weight:650}.btn.primary{background:var(--accent);color:var(--accentText);border-color:transparent}.btn.finalize{background:var(--consensus);border-color:#665494}.btn.danger{background:var(--danger)}
    #messages{padding:16px 14px 330px}.empty{padding:72px 24px;text-align:center;color:var(--muted);line-height:1.6}.empty strong{color:var(--text)}
    .card{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow);margin-bottom:16px}.card-head{padding:9px 13px;font-size:12px;font-weight:800;letter-spacing:.08em}.card-body{padding:14px 15px 16px;font-size:16px;line-height:1.58;white-space:pre-wrap;word-wrap:break-word}.speaker-Dylan .card-head{background:var(--dylan)}.speaker-GPT .card-head{background:var(--gpt)}.speaker-Claude .card-head{background:var(--claude)}.speaker-Consensus{border-color:#665494}.speaker-Consensus .card-head{background:var(--consensus)}
    .files-inline{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.file-chip{border:1px solid var(--border);border-radius:999px;padding:6px 9px;font-size:12px;color:var(--muted);background:var(--bg)}
    .composer{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(11,15,20,.97);backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:12px max(14px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}.composer-inner{max-width:820px;margin:0 auto}
    textarea{width:100%;min-height:78px;max-height:180px;resize:vertical;border:1px solid var(--border);border-radius:14px;background:var(--panel);color:var(--text);padding:13px 14px;outline:none}textarea:focus,input:focus{border-color:#4d6783}
    .attach-row{display:flex;align-items:center;gap:8px;margin-top:8px;min-height:36px}.attach-row .btn{padding:8px 11px}.selected-files{display:flex;gap:6px;overflow-x:auto;flex:1}.selected-file{white-space:nowrap;border:1px solid var(--border);border-radius:999px;padding:6px 9px;font-size:12px;color:var(--muted)}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.actions .btn{width:100%}.finalize-row{margin-top:8px}.finalize-row .btn{width:100%}
    .status{font-size:12px;color:var(--muted);min-height:17px;margin-top:8px}.usage{font-size:12px;color:var(--muted);margin-top:4px}
    .overlay{position:fixed;inset:0;z-index:100;background:rgba(7,10,14,.98);display:flex;align-items:center;justify-content:center;padding:22px}.overlay.hidden{display:none}.setup{width:100%;max-width:460px;border:1px solid var(--border);background:var(--panel);border-radius:20px;padding:22px;box-shadow:var(--shadow)}.setup h2{margin:0 0 8px}.setup p{color:var(--muted);line-height:1.5}.setup input{width:100%;padding:13px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);margin:8px 0 10px}.setup .btn{width:100%}.small{font-size:12px;color:var(--muted);margin-top:10px}.loading .btn,.loading textarea,.loading input{opacity:.55;pointer-events:none}
    @media (min-width:700px){#messages{padding-left:24px;padding-right:24px}.composer{padding-left:24px;padding-right:24px}}
  </style>
</head>
<body>
<div id="setupOverlay" class="overlay hidden">
  <div class="setup">
    <h2>Connect Think Tank</h2>
    <p>Enter your relay secret. It is stored only in this browser on this device. Your OpenAI and Anthropic API keys stay in Supabase.</p>
    <input id="secretInput" type="password" placeholder="Relay secret" autocomplete="off" />
    <button class="btn primary" id="saveSecretBtn">Save & Open</button>
    <div class="small">You can replace it later from Settings.</div>
  </div>
</div>

<div class="app" id="app">
  <header>
    <div class="top">
      <div><h1>Think Tank</h1><div class="sub">Dylan + GPT + Claude · human-controlled debate</div></div>
      <div class="header-actions"><button class="btn" id="settingsBtn">Settings</button><button class="btn" id="newBtn">New</button></div>
    </div>
  </header>

  <main id="messages"></main>

  <div class="composer">
    <div class="composer-inner">
      <textarea id="question" placeholder="Ask the think tank..."></textarea>
      <div class="attach-row">
        <input id="fileInput" type="file" multiple hidden accept=".txt,.md,.csv,.json,.sql,.js,.ts,.py,.html,.css,.xml,.yaml,.yml,.log,text/plain,text/markdown,text/csv,application/json" />
        <button class="btn" id="attachBtn">Attach Text File</button>
        <div class="selected-files" id="selectedFiles"></div>
      </div>
      <div class="actions">
        <button class="btn" id="nextBtn">Next Response</button>
        <button class="btn primary" id="sendBtn">Send</button>
      </div>
      <div class="finalize-row"><button class="btn finalize" id="finalizeBtn">Finalize Discussion</button></div>
      <div class="status" id="status"></div>
      <div class="usage" id="usage"></div>
    </div>
  </div>
</div>

<script>
  const RELAY_URL = "https://ddxhpsgwxqoejghmsatg.supabase.co/functions/v1/relay";
  const STORAGE = {
    secret: "thinktank_relay_secret",
    transcript: "thinktank_transcript_v1",
    nextSpeaker: "thinktank_first_speaker_v1",
    tokens: "thinktank_tokens_v1"
  };
  const MAX_FILES = 3;
  const MAX_ATTACHMENT_CHARS = 60000;

  let transcript = safeParse(localStorage.getItem(STORAGE.transcript), []);
  let nextSpeaker = localStorage.getItem(STORAGE.nextSpeaker) || "GPT";
  let totalTokens = Number(localStorage.getItem(STORAGE.tokens) || "0");
  let pendingFiles = [];
  let busy = false;

  const $ = (id) => document.getElementById(id);
  function safeParse(value, fallback){ try { return value ? JSON.parse(value) : fallback; } catch { return fallback; } }
  function getSecret(){ return localStorage.getItem(STORAGE.secret) || ""; }
  function saveState(){
    localStorage.setItem(STORAGE.transcript, JSON.stringify(transcript));
    localStorage.setItem(STORAGE.nextSpeaker, nextSpeaker);
    localStorage.setItem(STORAGE.tokens, String(totalTokens));
  }
  function escapeHtml(value){ return String(value ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;"); }
  function speakerClass(name){ return ["Dylan","GPT","Claude","Consensus"].includes(name) ? name : "Dylan"; }
  function formatBytes(bytes){ if (!Number.isFinite(bytes)) return ""; if (bytes < 1024) return `${bytes} B`; if (bytes < 1048576) return `${(bytes/1024).toFixed(1)} KB`; return `${(bytes/1048576).toFixed(1)} MB`; }

  function render(){
    if (!transcript.length) {
      $("messages").innerHTML = `<div class="empty"><strong>Start a discussion.</strong><br>Send gives both AIs one response. Use Next Response to let exactly one AI continue, or Finalize Discussion when you want them to converge on a shared output.</div>`;
    } else {
      $("messages").innerHTML = transcript.map(turn => {
        const files = Array.isArray(turn.attachments) && turn.attachments.length
          ? `<div class="files-inline">${turn.attachments.map(file => `<span class="file-chip">📎 ${escapeHtml(file.name)}</span>`).join("")}</div>`
          : "";
        const label = turn.speaker === "Consensus" ? "CONSENSUS OUTPUT" : escapeHtml(turn.speaker).toUpperCase();
        return `<section class="card speaker-${speakerClass(turn.speaker)}"><div class="card-head">${label}</div><div class="card-body">${escapeHtml(turn.text)}${files}</div></section>`;
      }).join("");
    }
    $("usage").textContent = `${totalTokens ? `Session tokens: ${totalTokens.toLocaleString()} · ` : ""}Next AI: ${nextSpeaker}`;
    renderPendingFiles();
  }

  function renderPendingFiles(){
    $("selectedFiles").innerHTML = pendingFiles.map(file => `<span class="selected-file">${escapeHtml(file.name)}${file.size ? ` · ${formatBytes(file.size)}` : ""}</span>`).join("");
  }

  function setBusy(value, message=""){
    busy = value;
    document.body.classList.toggle("loading", value);
    $("status").textContent = message;
  }

  async function callRelay(payload, busyMessage){
    if (busy) return null;
    const secret = getSecret();
    if (!secret) { $("setupOverlay").classList.remove("hidden"); return null; }
    setBusy(true, busyMessage);
    try {
      const response = await fetch(RELAY_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-relay-secret": secret },
        body: JSON.stringify(payload)
      });
      let data;
      try { data = await response.json(); } catch { throw new Error(`Relay returned HTTP ${response.status} with a non-JSON response.`); }
      if (!response.ok) throw new Error(data?.error || `Relay returned HTTP ${response.status}`);
      transcript = Array.isArray(data.transcript) ? data.transcript : transcript;
      nextSpeaker = data.nextSpeaker === "Claude" ? "Claude" : "GPT";
      totalTokens += Number(data?.usage?.roundTokens || 0);
      saveState();
      render();
      setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }), 40);
      return data;
    } catch (err) {
      const msg = String(err?.message || err);
      $("status").textContent = msg.includes("Failed to fetch")
        ? "Could not reach the relay. Check the deployed relay/CORS configuration."
        : `Error: ${msg}`;
      return null;
    } finally {
      busy = false;
      document.body.classList.remove("loading");
    }
  }

  async function readSelectedFiles(fileList){
    const files = Array.from(fileList || []);
    if (!files.length) return;
    if (files.length > MAX_FILES) { $("status").textContent = `Choose up to ${MAX_FILES} text files at once.`; return; }

    try {
      const read = await Promise.all(files.map(async file => ({ name:file.name, type:file.type || "text/plain", size:file.size, text:await file.text() })));
      const totalChars = read.reduce((sum, file) => sum + file.text.length, 0);
      if (totalChars > MAX_ATTACHMENT_CHARS) throw new Error(`Combined file text is too large. Limit: ${MAX_ATTACHMENT_CHARS.toLocaleString()} characters.`);
      pendingFiles = read;
      renderPendingFiles();
      $("status").textContent = `${read.length} text file${read.length === 1 ? "" : "s"} ready to send.`;
    } catch (err) {
      pendingFiles = [];
      renderPendingFiles();
      $("status").textContent = `File error: ${String(err?.message || err)}`;
    } finally {
      $("fileInput").value = "";
    }
  }

  $("sendBtn").addEventListener("click", async () => {
    const text = $("question").value.trim();
    if (!text && !pendingFiles.length) return;
    const attachments = pendingFiles;
    const data = await callRelay({ action:"message", message:text, transcript, nextSpeaker, attachments }, `${nextSpeaker} is starting. Both AIs will respond...`);
    if (data) {
      $("question").value = "";
      pendingFiles = [];
      renderPendingFiles();
      $("status").textContent = "Both AIs responded. You have the floor, or press Next Response.";
    }
  });

  $("nextBtn").addEventListener("click", async () => {
    if (!transcript.length) { $("status").textContent = "Start a conversation first."; return; }
    const speaker = nextSpeaker;
    const data = await callRelay({ action:"next", transcript, nextSpeaker:speaker }, `${speaker} is responding...`);
    if (data) $("status").textContent = `${speaker} responded. Next AI: ${nextSpeaker}.`;
  });

  $("finalizeBtn").addEventListener("click", async () => {
    if (!transcript.length) { $("status").textContent = "Start a conversation first."; return; }
    if (!confirm("Finalize this discussion? GPT and Claude will draft, review, and revise toward a shared final output.")) return;
    const data = await callRelay({ action:"finalize", transcript, nextSpeaker }, "GPT and Claude are working toward a final shared output...");
    if (data) {
      const status = data?.finalization?.status;
      $("status").textContent = status === "agreed"
        ? "Finalized: GPT and Claude agreed on the consensus output."
        : "Finalization completed, but material disagreement remained and is shown in the consensus output.";
    }
  });

  $("attachBtn").addEventListener("click", () => $("fileInput").click());
  $("fileInput").addEventListener("change", (e) => readSelectedFiles(e.target.files));

  $("newBtn").addEventListener("click", () => {
    if (transcript.length && !confirm("Start a new Think Tank conversation?")) return;
    transcript = []; nextSpeaker = "GPT"; totalTokens = 0; pendingFiles = []; saveState(); render(); $("status").textContent = ""; $("question").value = "";
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  $("settingsBtn").addEventListener("click", () => {
    const action = confirm("Press OK to replace the relay secret. Press Cancel to keep the current one.");
    if (action) { $("secretInput").value = ""; $("setupOverlay").classList.remove("hidden"); }
  });

  $("saveSecretBtn").addEventListener("click", () => {
    const value = $("secretInput").value.trim();
    if (!value) return;
    localStorage.setItem(STORAGE.secret, value);
    $("secretInput").value = "";
    $("setupOverlay").classList.add("hidden");
    $("status").textContent = "Relay secret saved on this device.";
  });

  $("question").addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") $("sendBtn").click(); });

  if (!getSecret()) $("setupOverlay").classList.remove("hidden");
  render();
</script>
</body>
</html>
